<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>沪上孤刀 · 1937 SHANGHAI COLD-STEEL</title>
<link rel="preload" as="image" href="assets/loading/loading-shikumen.webp">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;600;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --night:#090e1a;
  --panel:rgba(13,19,32,.90);
  --ink:#f4ebd8;
  --dim:#a8a090;
  --lantern:#e5b352;
  --lantern-hi:#ffd984;
  --blood:#b8291f;
  --line:rgba(229,179,82,.28);
  --display:"Ma Shan Zheng","STKaiti","KaiTi","Kaiti SC",serif;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;padding:0}
body{
  background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none
}
#gl,#hud{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{cursor:crosshair}

/* Start / Pause / Clear Art-Deco Modal */
#ui{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding-block:18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(circle at 50% 42%,rgba(16,26,46,.42),rgba(5,8,15,.78));
  backdrop-filter:blur(6px);
  overflow-y:auto
}
.panel{
  position:relative;
  width:min(100%,640px);
  background:linear-gradient(180deg,rgba(18,26,44,.94),rgba(10,15,26,.96));
  border:1px solid rgba(229,179,82,.52);
  outline:1px solid rgba(229,179,82,.18);
  outline-offset:-7px;
  padding:30px 30px 24px;
  display:flex;flex-direction:column;gap:15px;
  text-align:center;margin:auto;
  box-shadow:0 28px 80px rgba(0,0,0,.78),inset 0 1px 0 rgba(255,225,160,.18)
}
.panel h1{
  font-family:var(--display);font-weight:400;
  font-size:clamp(48px,12vw,76px);line-height:1.02;color:var(--ink);
  letter-spacing:.1em;margin:0;
  text-shadow:0 4px 24px rgba(0,0,0,.7),0 0 28px rgba(229,179,82,.22)
}
.panel h2{
  font-family:var(--display);font-weight:400;font-size:40px;margin:0;
  color:var(--lantern-hi);letter-spacing:.08em;
  text-shadow:0 2px 16px rgba(229,179,82,.25)
}
.panel .sub{
  color:var(--lantern);letter-spacing:.36em;font-size:12px;font-weight:700;
  text-transform:uppercase
}
.deco-rule{
  display:flex;align-items:center;justify-content:center;gap:10px;
  color:rgba(229,179,82,.7);font-size:11px;letter-spacing:.2em
}
.deco-rule::before,.deco-rule::after{
  content:"";flex:1;max-width:120px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(229,179,82,.65),transparent)
}
.panel p{margin:0;color:var(--dim);line-height:1.72;font-size:14px}
.panel p b{color:var(--ink);font-weight:700}

.hero-picker{border:0;padding:0;margin:0;text-align:left;min-width:0}
.hero-picker legend,.rain-control label,.menu-keys summary{color:var(--lantern-hi);font-size:13px;font-weight:700;letter-spacing:.1em}
.hero-picker legend{width:100%;margin-bottom:5px;padding:0}
.hero-heading{display:flex;align-items:center;justify-content:space-between}
.hero-listen,.motion-open{color:var(--lantern-hi);background:transparent;border:1px solid var(--line);
  padding:3px 10px;min-height:26px;font:600 12px var(--body);letter-spacing:.08em;cursor:pointer}
.hero-listen:hover,.hero-listen:focus-visible,.motion-open:hover,.motion-open:focus-visible{border-color:var(--lantern-hi)}
#motion-library{width:min(880px,94vw);max-height:90dvh;margin:auto;padding:20px;color:var(--ink);
  background:#111a26;border:1px solid var(--line);font-family:var(--body);overflow:auto}
#motion-library::backdrop{background:rgba(4,8,13,.86)}
#motion-library header,.motion-tools{display:flex;align-items:center;justify-content:space-between;gap:12px}
#motion-library header{margin-bottom:16px}
#motion-library h2{margin:0;color:var(--lantern-hi);font:normal 28px var(--display)}
#motion-library label,.motion-browser,.motion-detail{display:flex;flex-direction:column;gap:6px;min-width:0}
#motion-library label,#motion-library small,[data-note]{color:var(--dim);font-size:13px}
#motion-library input,#motion-library select,#motion-library button{font:inherit;color:var(--ink);border:1px solid var(--line);background:#1c2735;padding:6px 8px;min-width:0}
#motion-library button,#motion-library a{color:var(--lantern-hi);cursor:pointer}
#motion-library option:checked{color:#fff;background:#48576a}
.motion-layout{display:grid;grid-template-columns:minmax(150px,.85fr) minmax(0,1.6fr);gap:18px}
.motion-browser{gap:9px}.motion-browser select[size]{width:100%;flex:1;min-height:145px}
.motion-detail{gap:8px}.motion-detail strong{overflow-wrap:anywhere}
.motion-stage{position:relative;height:clamp(210px,43dvh,390px);overflow:hidden;background:#19232b}
.motion-detail [data-online] img{display:block;width:100%;height:clamp(180px,38dvh,350px);object-fit:contain;background:#19232b}
.motion-detail [data-versions]{margin-top:8px}
.motion-stage #gl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.motion-tools label{flex:1}.motion-tools button{align-self:end}
@media(max-width:580px){#motion-library{padding:12px}.motion-layout{grid-template-columns:1fr;gap:12px}
  .motion-browser{display:grid;grid-template-columns:1fr 1fr}.motion-browser select[size],.motion-browser small{grid-column:1/-1}
  .motion-browser select[size]{height:76px;min-height:0}.motion-stage{height:clamp(160px,29dvh,250px)}}
.hero-options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero-option{position:relative;min-width:0;cursor:pointer}
.hero-option input{position:absolute;width:1px;height:1px;opacity:0}
.hero-card{display:flex;position:relative;aspect-ratio:7/4;isolation:isolate;align-items:flex-end;
  overflow:hidden;border:1px solid #4a4945;background:#121e21;transition:border-color .18s}
.hero-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:65% top;z-index:-2}
.hero-card::before{content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(90deg,rgba(4,12,15,.48),transparent 56%),linear-gradient(0deg,rgba(3,9,12,.52),transparent 40%)}
.hero-caption{display:grid;gap:4px;padding:12px 15px;text-shadow:0 1px 4px #091013}
.hero-caption small{font-size:11px;letter-spacing:.16em;color:#c5b18c}
.hero-caption strong{font:400 clamp(24px,3vw,30px)/1 var(--display);color:var(--ink);letter-spacing:.08em}
.hero-tick{position:absolute;right:0;top:0;display:none;background:var(--lantern);color:#211a14;
  font:bold 13px/19px var(--body);width:22px;text-align:center}
.hero-option input:checked + .hero-card{border-color:var(--lantern-hi);box-shadow:inset 2px 0 var(--lantern)}
.hero-option input:checked + .hero-card .hero-tick{display:block}
.hero-option input:focus-visible + .hero-card{outline:2px solid var(--ink);outline-offset:2px}
.hero-option input:disabled + .hero-card{opacity:.5;cursor:default}
.rain-control{display:grid;grid-template-columns:auto 1fr 4ch;align-items:center;gap:14px;text-align:left}
.rain-control input{width:100%;margin:0;accent-color:var(--lantern);cursor:pointer;height:26px;touch-action:pan-y}
.rain-control output{font-size:12px;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.menu-keys{text-align:left;border-top:1px solid var(--line);padding-top:6px}
.menu-keys summary{cursor:pointer;padding:4px 0}
.menu-keys .key-grid{margin-top:4px;border:0;padding-top:4px}
@media(max-width:520px){
  .hero-card{aspect-ratio:3/2}.hero-caption{padding:8px}.hero-caption small{font-size:10px}
  .hero-caption strong{font-size:clamp(19px,5.5vw,26px)}.hero-options{gap:7px}
}

.loadout-strip{
  display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;
  background:rgba(8,12,22,.68);border:1px solid rgba(229,179,82,.24);
  padding:8px 12px;font-size:12px;color:var(--dim)
}
.loadout-pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:3px 9px;background:rgba(229,179,82,.12);
  border:1px solid rgba(229,179,82,.38);color:var(--ink);font-weight:600;font-size:12px
}
.loadout-pill em{font-style:normal;color:var(--lantern);font-size:11px}

.key-grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;
  text-align:left;border-top:1px solid rgba(229,179,82,.2);padding-top:14px
}
.key-item{
  background:rgba(9,14,24,.66);border:1px solid rgba(255,255,255,.06);
  padding:7px 10px;display:flex;flex-direction:column;gap:3px
}
.key-item b{
  font-size:12px;color:var(--lantern-hi);letter-spacing:.03em
}
.key-item span{font-size:12px;color:var(--dim);line-height:1.4}

.stats{display:flex;justify-content:center;gap:36px;font-variant-numeric:tabular-nums;padding:6px 0}
.stats div{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--dim)}
.stats b{font-size:28px;color:var(--lantern-hi)}

button{font-family:var(--body);font-weight:700;color:inherit;transition:all .16s ease}
.btn-row{display:grid;grid-template-columns:1fr 1.25fr;gap:12px;margin-top:2px}
.btn-row.single{grid-template-columns:1fr}
.go{
  background:linear-gradient(180deg,#c83226,#8c1b13);
  color:#fff8ec;border:1px solid rgba(255,212,138,.52);
  padding:14px 22px;font-size:16px;letter-spacing:.22em;cursor:pointer;
  box-shadow:0 8px 24px rgba(184,41,31,.38),inset 0 1px 0 rgba(255,255,255,.22)
}
.go:hover{filter:brightness(1.14);transform:translateY(-1px)}
.go:disabled{background:#2d3342;border-color:#444b5c;cursor:default;filter:none;transform:none;box-shadow:none}

.btn-sec{
  background:linear-gradient(180deg,#202a3e,#141c2c);
  color:var(--lantern-hi);border:1px solid rgba(229,179,82,.55);
  padding:12px 16px;font-size:14px;letter-spacing:.1em;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,226,164,.14)
}
.btn-sec:hover{background:linear-gradient(180deg,#2a3752,#1a2438);border-color:var(--lantern-hi);transform:translateY(-1px)}
.link-btn{
  align-self:center;background:transparent;border:0;color:var(--dim);
  padding:4px 10px;font-size:12px;font-weight:600;letter-spacing:.12em;cursor:pointer;
  text-decoration:underline;text-underline-offset:4px
}
.link-btn:hover,.link-btn:focus-visible{color:var(--lantern-hi)}
.level-picker{
  display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;
  background:rgba(8,12,22,.68);border:1px solid rgba(229,179,82,.24);
  padding:8px 12px;font-size:12px;color:var(--dim)
}
.level-opt{position:relative;cursor:pointer}
.level-opt input{position:absolute;width:1px;height:1px;opacity:0}
.level-pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 10px;background:rgba(255,255,255,.04);
  border:1px solid rgba(229,179,82,.26);color:var(--dim);font-weight:600;font-size:12px;
  transition:all .16s ease
}
button.level-pill{cursor:pointer}
button.level-pill:hover,button.level-pill:focus-visible,button.level-pill.active{
  background:rgba(229,179,82,.22);border-color:var(--lantern-hi);color:var(--lantern-hi)
}
.level-opt input:checked + .level-pill{
  background:rgba(229,179,82,.18);border-color:var(--lantern-hi);color:var(--lantern-hi)
}
.level-opt input:focus-visible + .level-pill{outline:2px solid var(--lantern-hi);outline-offset:2px}
.panel .credit{font-size:11px;line-height:1.6;color:rgba(168,160,144,.78);border-top:1px solid rgba(229,179,82,.18);padding-top:11px}
.go:focus-visible,.tb:focus-visible,.btn-sec:focus-visible{outline:2px solid var(--lantern-hi);outline-offset:3px}

/* 1937 Shanghai Art-Deco Luxury Interactive Armory Showcase */
#armory{
  position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  padding:14px;
  background:radial-gradient(circle at 50% 35%,rgba(19,30,52,.86),rgba(5,8,15,.94));
  backdrop-filter:blur(10px);
  overflow-y:auto
}
.armory-panel{
  width:min(100%,1060px);
  background:linear-gradient(180deg,rgba(17,24,40,.97),rgba(9,13,23,.98));
  border:1px solid rgba(229,179,82,.58);
  outline:1px solid rgba(229,179,82,.18);
  outline-offset:-6px;
  padding:18px 22px;
  display:flex;flex-direction:column;gap:14px;
  box-shadow:0 32px 90px rgba(0,0,0,.86);margin:auto
}
.armory-hdr{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  border-bottom:1px solid rgba(229,179,82,.26);padding-bottom:10px
}
.armory-title-wrap{display:flex;flex-direction:column;gap:2px}
.armory-kicker{font-size:10.5px;letter-spacing:.28em;color:var(--lantern);text-transform:uppercase;font-weight:700}
.armory-hdr h2{
  margin:0;font-family:var(--display);font-weight:400;font-size:32px;
  color:var(--ink);letter-spacing:.08em
}
.armory-sub{font-size:12px;color:var(--dim)}
.armory-sub b{color:var(--lantern-hi)}

/* Split Hero: Featured Studio Stage (Left) + 3 Holster Slots (Right) */
.armory-hero{
  display:grid;grid-template-columns:1.38fr 1fr;gap:14px;align-items:stretch
}
.gun-stage{
  background:radial-gradient(circle at 50% 38%,#243554 0%,#121b2d 62%,#0a101c 100%);
  border:1px solid rgba(229,179,82,.42);
  padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;
  position:relative;overflow:hidden
}
.stage-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;z-index:1}
.stage-name{display:flex;flex-direction:column;gap:2px}
.stage-name h3{margin:0;font-size:20px;color:var(--ink);letter-spacing:.04em}
.stage-name span{font-size:12px;color:var(--lantern);font-weight:600}
.stage-pill{
  padding:4px 10px;font-size:11px;font-weight:700;
  background:rgba(229,179,82,.16);color:var(--lantern-hi);
  border:1px solid rgba(229,179,82,.48);white-space:nowrap
}
.stage-render-wrap{
  height:142px;display:flex;align-items:center;justify-content:center;position:relative
}
.stage-render{
  max-width:92%;max-height:138px;object-fit:contain;
  filter:drop-shadow(0 14px 20px rgba(0,0,0,.78)) drop-shadow(0 0 22px rgba(229,179,82,.22));
  transition:transform .2s ease
}
.gun-stage:hover .stage-render{transform:scale(1.03)}
.stage-desc{font-size:12.5px;color:#cbc3b2;line-height:1.5}
.stage-stats{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 16px;
  background:rgba(7,11,20,.62);border:1px solid rgba(229,179,82,.18);padding:9px 12px
}
.st-row{display:grid;grid-template-columns:34px 1fr 30px;align-items:center;gap:8px;font-size:11px;color:var(--dim)}
.st-row strong{color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.stat-bar{height:6px;background:#1a2336;overflow:hidden;border:1px solid rgba(255,255,255,.06)}
.stat-bar i{display:block;height:100%;background:linear-gradient(90deg,#b8291f,#e5b352)}
.stage-actions{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stage-ammo{font-size:12px;color:var(--dim)}
.stage-ammo b{color:var(--lantern-hi)}
.stage-act-btn{
  padding:8px 16px;font-size:13px;cursor:pointer;letter-spacing:.08em;
  border:1px solid rgba(229,179,82,.6);background:linear-gradient(180deg,#b8291f,#821912);color:#fff8ec
}
.stage-act-btn.unequip{background:linear-gradient(180deg,#253047,#171f30);color:var(--lantern-hi)}
.stage-act-btn:hover:not(:disabled){filter:brightness(1.14)}
.stage-act-btn:disabled{opacity:.52;cursor:not-allowed;background:#1a2130;color:#9ea6b6;border-color:rgba(140,152,175,.3)}

/* Right Column: 3 Visual Holster Slots */
.holster-col{display:flex;flex-direction:column;gap:8px;justify-content:space-between}
.holster-lbl{
  font-size:11.5px;color:var(--lantern);font-weight:700;letter-spacing:.08em;
  display:flex;justify-content:space-between;align-items:center
}
.holster-lbl span{color:var(--dim);font-weight:400;font-size:11px}
.slot-card{
  flex:1;min-height:86px;
  background:linear-gradient(90deg,rgba(14,21,36,.95),rgba(19,28,46,.88));
  border:1px solid rgba(229,179,82,.26);
  padding:8px 12px;display:grid;grid-template-columns:34px 108px 1fr auto;
  align-items:center;gap:10px;cursor:pointer;text-align:left;
  transition:border-color .15s,background .15s,transform .15s
}
.slot-card:hover{border-color:rgba(229,179,82,.62);background:rgba(24,35,56,.95)}
.slot-card.active-slot{
  border-color:var(--lantern-hi);
  background:linear-gradient(90deg,rgba(42,32,20,.92),rgba(20,29,48,.95));
  box-shadow:inset 3px 0 0 var(--lantern-hi),0 6px 18px rgba(0,0,0,.4)
}
.slot-num{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:700;font-size:15px;color:var(--lantern-hi);
  border-right:1px solid rgba(229,179,82,.22);padding-right:8px
}
.slot-num small{font-size:9px;color:var(--dim);font-weight:600}
.slot-thumb-wrap{
  width:108px;height:54px;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle,rgba(38,54,84,.55),rgba(10,15,26,.75));
  border:1px solid rgba(229,179,82,.18)
}
.slot-thumb{max-width:98px;max-height:48px;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.65))}
.slot-info{display:flex;flex-direction:column;gap:3px;min-width:0}
.slot-info b{font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot-info span{font-size:11px;color:var(--dim)}
.slot-rm{
  padding:4px 8px;font-size:11px;background:rgba(184,41,31,.22);
  color:#ff9d92;border:1px solid rgba(220,72,58,.45);cursor:pointer
}
.slot-rm:hover{background:rgba(184,41,31,.48);color:#fff}

/* Bottom 8-Gun Arsenal Grid */
.arsenal-hdr{
  display:flex;justify-content:space-between;align-items:center;
  font-size:11.5px;color:var(--lantern);font-weight:700;letter-spacing:.08em;
  padding-top:2px
}
.arsenal-hdr span{color:var(--dim);font-weight:400}
.gun-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.gun-card{
  position:relative;
  background:linear-gradient(180deg,#131c2e,#0d1321);
  border:1px solid rgba(120,138,172,.28);
  padding:9px 10px;display:flex;flex-direction:column;gap:5px;
  cursor:pointer;text-align:left;transition:all .15s ease
}
.gun-card:hover,.gun-card.inspecting{
  border-color:rgba(229,179,82,.75);background:linear-gradient(180deg,#1a263e,#11192b);
  transform:translateY(-2px)
}
.gun-card.equipped{
  border-color:var(--lantern);
  box-shadow:inset 0 0 0 1px rgba(229,179,82,.32),0 6px 16px rgba(0,0,0,.42)
}
.gun-card.locked{opacity:.58;border-style:dashed}
.gun-card.locked .gun-prev{filter:grayscale(.72) brightness(.72)}
.gun-badge.locked{background:rgba(120,130,150,.18);color:#aeb6c6;border-color:rgba(140,152,175,.42)}
.gun-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.gun-top b{font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gun-badge{
  font-size:10px;padding:1px 6px;font-weight:700;
  background:rgba(229,179,82,.22);color:var(--lantern-hi);
  border:1px solid rgba(229,179,82,.55);white-space:nowrap
}
.gun-prev{width:100%;height:78px;object-fit:cover;border:1px solid rgba(229,179,82,.18);background:#0c121e}
.gun-meta{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:var(--dim)}
.gun-meta em{font-style:normal;color:var(--lantern)}

.armory-ftr{
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  border-top:1px solid rgba(229,179,82,.24);padding-top:10px
}
.armory-tip{font-size:12px;color:var(--dim)}

/* Souls-Like Cold-Steel Upgrade Forge Modal */
.upg-panel{max-width:920px}
.upg-points{
  display:inline-flex;align-items:center;gap:10px;
  padding:8px 16px;background:linear-gradient(180deg,rgba(48,34,14,.92),rgba(20,16,12,.95));
  border:1px solid rgba(255,216,120,.65);
  box-shadow:0 0 22px rgba(229,179,82,.22)
}

    <button class="t-ult" id="bUlt3" type="button"><span>旋风乱舞</span><small>55气</small></button>
  </div>
  <button class="tb" id="bGun" type="button">绝技</button>
  <button class="tb" id="bSneak" type="button" aria-label="猫腰潜行" aria-pressed="false">潜行</button>
  <button class="tb" id="bCrouch" type="button" aria-label="低蹲" aria-pressed="false">低蹲</button>
  <button class="tb" id="bArmory" type="button">强化</button>
  <button class="tb" id="bPause" type="button">暂停</button>
